name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag and Cargo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: kit
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: kit
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: kit
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: kit
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -j 2
      - name: Package release binary
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir package release-assets
          cp "target/${TARGET}/release/${BINARY}" "package/${BINARY}"
          tar -czf "release-assets/kit-${VERSION}-${TARGET}.tar.gz" -C package "${BINARY}"
      - uses: actions/upload-artifact@v7
        with:
          name: kit-${{ matrix.target }}
          path: release-assets/*.tar.gz
          if-no-files-found: error
