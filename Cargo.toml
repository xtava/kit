[package]
name = "kit"
version = "0.1.0"
edition = "2021"
description = "A personal toolbelt — one binary, many sharp tools."
license = "MIT"
readme = "README.md"
repository = "https://github.com/xtava/kit"
keywords = ["cli", "cdp", "electron", "devtools", "toolbelt"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
toml = "1.1"
toml_edit = "0.25"
yaml_serde = "0.10"
directories = "6"
unicode-width = "0.2"
url = { version = "2.5", features = ["serde"] }
thiserror = "2"
zeroize = "1"
shell-words = "1"
ignore = "0.4"
notify = "8.2"
nucleo = "0.5"
petgraph = { version = "=0.8.3", default-features = false, features = ["std"] }
processkit = "2.2.5"
uuid = { version = "1", features = ["v4", "serde"] }
systemd-zbus = { version = "5.3.2", default-features = false }
zbus = { version = "5.7", default-features = false, features = ["tokio"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "fs", "time", "sync", "process", "signal"] }

ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = "0.13"
syntect = "5"
two-face = "0.5"
similar = { version = "3", features = ["inline", "unicode"] }
time = { version = "0.3", features = ["formatting"] }
sysinfo = { version = "=0.37.2", default-features = false, features = ["system", "user"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
self_update = { version = "=1.0.0-rc.6", default-features = false, features = [
    "archive-tar",
    "async",
    "checksums",
    "compression-tar-gz",
    "github",
    "progress-bar",
    "reqwest",
    "rustls",
] }
hickory-resolver = { version = "0.26", features = ["tokio"] }
idna = "1.1"

tokio-tungstenite = "0.24"
futures-util = "0.3"

libc = "0.2"
rustix = { version = "1.1", features = ["param", "process"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
wezterm-config = { package = "config", path = "vendor/wezterm/config" }
wezterm-mux = { package = "mux", path = "vendor/wezterm/mux" }
wezterm-promise = { package = "promise", path = "vendor/wezterm/promise" }
wezterm-client = { path = "vendor/wezterm/wezterm-client" }
wezterm-codec = { package = "codec", path = "vendor/wezterm/codec" }
wezterm-mux-server-impl = { path = "vendor/wezterm/wezterm-mux-server-impl" }
wezterm-blob-leases = { path = "vendor/wezterm/wezterm-blob-leases", features = ["simple_tempdir"] }
wezterm-term = { path = "vendor/wezterm/term", features = ["use_serde"] }
termwiz = { path = "vendor/wezterm/termwiz", features = ["use_serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = true
strip = true

[dev-dependencies]
portable-pty = { path = "vendor/wezterm/pty" }
wezterm-runtime-admission = { path = "vendor/wezterm/wezterm-runtime-admission" }
