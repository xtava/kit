[package]
name = "kit"
version = "0.1.0"
edition = "2021"
description = "A personal toolbelt — one binary, many sharp tools."
license = "MIT"
readme = "README.md"
repository = "https://github.com/xtava/kit"
keywords = ["cli", "cdp", "electron", "devtools", "toolbelt"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
directories = "6"
unicode-width = "0.2"
thiserror = "2"
shell-words = "1"
ignore = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }

ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
pulldown-cmark = "0.13"
syntect = "5"
similar = { version = "3", features = ["inline", "unicode"] }
time = { version = "0.3", features = ["formatting"] }
sysinfo = { version = "=0.37.2", default-features = false, features = ["system", "user"] }

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
hickory-resolver = { version = "0.26", features = ["tokio"] }
idna = "1.1"

tokio-tungstenite = "0.24"
futures-util = "0.3"

libc = "0.2"
rustix = { version = "1.1", features = ["param", "process"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = true
strip = true
